<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Evento</title>

    <link rel="stylesheet" href="./css/evento.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <h1>MMA VAULT</h1>

        <p>Seu arquivo pessoal do MMA</p>
      </div>

      <nav>
        <a href="index.html"> 🏠 Dashboard </a>

        <a href="eventos.html"> 📅 Eventos </a>

        <a href="criar-evento.html"> ➕ Criar Evento </a>

        <a href="ranking.html"> 🏆 Ranking </a>

        <a href="timeline.html"> ⏱️ Timeline </a>
      </nav>

      <div class="sidebar-footer">
        <div class="info">
          <span> Eventos: </span>

          <strong id="totalEventosSidebar"> 0 </strong>
        </div>

        <div class="info">
          <span> Lutas: </span>

          <strong id="totalLutasSidebar"> 0 </strong>
        </div>
      </div>
    </aside>

    <main>
      <header class="topo">
        <div class="topo-esquerda">
          <a href="eventos.html" class="btn-voltar">← Eventos</a>

          <div>
            <h1 id="nomeEvento">Carregando...</h1>

            <p id="subtituloEvento">—</p>
          </div>
        </div>

        <a id="btnEditar" href="#" class="btn-editar">✏️ Editar evento</a>
      </header>

      <section class="resumo">
        <div class="poster-wrap">
          <img
            id="posterEvento"
            src="./img/sem-poster.png"
            alt="Poster do evento"
          />
        </div>

        <div class="dados-gerais">
          <div class="dado-item">
            <span class="dado-label">Data</span>
            <span class="dado-valor" id="dataEvento">—</span>
          </div>

          <div class="dado-item">
            <span class="dado-label">Número UFC</span>
            <span class="dado-valor" id="numeroEvento">—</span>
          </div>

          <div class="dado-item">
            <span class="dado-label">Total de lutas</span>
            <span class="dado-valor" id="totalLutas">—</span>
          </div>

          <div class="dado-item">
            <span class="dado-label">Nota do evento</span>
            <span class="dado-valor nota-destaque" id="notaEvento">—</span>
          </div>

          <div class="dado-item full">
            <span class="dado-label">Observações</span>
            <span class="dado-valor" id="observacoesEvento">—</span>
          </div>

          <div class="dado-item full" id="linkWrap" style="display: none">
            <a id="linkEvento" href="#" target="_blank" class="btn-link">
              🔗 Ver evento completo
            </a>
          </div>
        </div>
      </section>

      <section class="lutas-section">
        <h2 class="section-title">Lutas</h2>

        <div id="listaLutas"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="./js/cloud-sync.js"></script>
    <script src="./js/sidebar.js"></script>
    <script src="./js/evento.js"></script>
  </body>
</html>
